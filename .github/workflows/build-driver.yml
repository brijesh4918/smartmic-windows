name: Build SmartMic Windows Driver

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-driver:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Add MSBuild to PATH
        uses: microsoft/setup-msbuild@v2

      - name: Download Windows Driver Kit (WDK)
        shell: cmd
        run: curl.exe -L -o wdksetup.exe "https://go.microsoft.com/fwlink/?linkid=2166289"

      - name: Install Windows Driver Kit (WDK)
        run: Start-Process -FilePath .\wdksetup.exe -ArgumentList "/q" -Wait -NoNewWindow

      # Capture the whole build into a file as well as the step output. When
      # this fails, the log is downloadable as an artifact, which is far
      # quicker than reading it back out of the web UI.
      - name: Build Driver
        working-directory: windows/driver
        shell: cmd
        run: |
          call build-driver.bat > build-log.txt 2>&1
          set RC=%ERRORLEVEL%
          type build-log.txt
          exit /b %RC%

      - name: Upload the driver build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: SmartMic-Driver-BuildLog
          path: windows/driver/build-log.txt
          if-no-files-found: warn

      # An unsigned kernel driver installs happily and then never loads, which
      # is exactly the failure this repository already shipped once. Fail the
      # build here instead of finding out on the target machine.
      - name: Verify the package is signed
        shell: pwsh
        working-directory: windows/driver
        run: |
          $out = if (Test-Path "x64\Release\smartmic\smartmic.sys") { "x64\Release\smartmic" } else { "x64\Release" }
          foreach ($f in @("smartmic.sys", "smartmic.cat", "smartmic.inf", "SmartMicTestCert.cer")) {
            if (-not (Test-Path "$out\$f")) { throw "missing from the package: $f" }
          }
          foreach ($f in @("smartmic.sys", "smartmic.cat")) {
            $sig = Get-AuthenticodeSignature "$out\$f"
            Write-Host "$f -> $($sig.Status)  $($sig.SignerCertificate.Subject)"
            if ($sig.Status -eq "NotSigned") { throw "$f is NOT SIGNED -- it could never load" }
          }
          Write-Host "package contents:"
          Get-ChildItem $out | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload compiled driver artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMic-Driver
          # The whole output folder: msbuild puts the package either directly
          # in Release or in a Release\smartmic subfolder depending on the
          # toolchain, and both layouts are covered this way.
          path: windows/driver/x64/Release/
          if-no-files-found: error

  build-service:
    runs-on: windows-2022
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Dependencies (vcpkg)
        run: vcpkg install pkgconf libsodium opus nlohmann-json --triplet x64-windows

      - name: Configure CMake
        run: cmake -S . -B build -A x64 -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_INSTALLATION_ROOT\scripts\buildsystems\vcpkg.cmake"

      - name: Build Windows Service
        run: cmake --build build --config Release

      - name: Stage the service package
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path staging | Out-Null
          Copy-Item build\apps\Release\* staging\ -Recurse -Force
          Copy-Item docs\service-readme.txt staging\README.txt -Force
          Get-ChildItem staging | Select-Object Name, Length | Format-Table -AutoSize

      - name: Upload compiled service artifact
        uses: actions/upload-artifact@v4
        with:
          name: SmartMic-Service
          path: staging/
          if-no-files-found: error
